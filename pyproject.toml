[project]
name = "paperdiff"
version = "0.1.0"
description = "Report differences between the experimental setup a paper states and what its code actually configures."
readme = "README.md"
license = "MIT"
authors = [
    { name = "majiayu000", email = "1835304752@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0",
    "pyyaml>=6.0",
]

[project.scripts]
paperdiff = "paperdiff.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"
